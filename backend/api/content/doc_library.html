<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>{{system}} {{environment}} - Doc Library</title>
		<link rel="shortcut icon" href="/favicon.ico?src=doc_library" />

		<script type="text/javascript" src="/public/jquery-1.8.2.mini.js"></script>
		
		<style type="text/css">
			* {
				box-sizing: border-box;
			}
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 0;
				background: #f5f5f5;
				height: 100vh;
				overflow: hidden;
			}
			.layout {
				display: flex;
				height: 100vh;
			}
			.sidebar {
				width: 280px;
				min-width: 280px;
				background: #2c3e50;
				color: #ecf0f1;
				overflow-y: auto;
				padding: 0;
				border-right: 1px solid #1a252f;
			}
			.sidebar-header {
				padding: 16px 20px;
				font-size: 16px;
				font-weight: bold;
				background: #1a252f;
				border-bottom: 1px solid #34495e;
			}
			.sidebar-list {
				list-style: none;
				margin: 0;
				padding: 0;
			}
			.sidebar-list li {
				padding: 12px 20px;
				cursor: pointer;
				border-bottom: 1px solid #34495e;
				font-size: 13px;
				transition: background 0.15s;
			}
			.sidebar-list li:hover {
				background: #34495e;
			}
			.sidebar-list li.active {
				background: #2980b9;
				color: #fff;
			}
			.main-content {
				flex: 1;
				overflow-y: auto;
				padding: 30px 40px;
				background: #fff;
			}
			.welcome-message {
				color: #888;
				font-size: 16px;
				margin-top: 80px;
				text-align: center;
			}
			.loading {
				color: #888;
				font-size: 14px;
				margin-top: 40px;
				text-align: center;
			}

			/* Markdown styles */
			.md-body h1 {
				font-size: 24px;
				color: #2c3e50;
				border-bottom: 2px solid #eee;
				padding-bottom: 8px;
				margin: 24px 0 16px 0;
			}
			.md-body h2 {
				font-size: 20px;
				color: #34495e;
				border-bottom: 1px solid #eee;
				padding-bottom: 6px;
				margin: 20px 0 12px 0;
			}
			.md-body h3 {
				font-size: 16px;
				color: #444;
				margin: 16px 0 10px 0;
			}
			.md-body h4 {
				font-size: 14px;
				color: #555;
				margin: 14px 0 8px 0;
			}
			.md-body p {
				margin: 8px 0;
				line-height: 1.6;
				color: #333;
			}
			.md-body pre {
				background: #f8f9fa;
				border: 1px solid #e1e4e8;
				border-radius: 4px;
				padding: 12px 16px;
				overflow-x: auto;
				font-size: 13px;
				line-height: 1.5;
			}
			.md-body code {
				background: #f0f0f0;
				padding: 2px 5px;
				border-radius: 3px;
				font-family: 'Courier New', monospace;
				font-size: 13px;
			}
			.md-body pre code {
				background: none;
				padding: 0;
			}
			.md-body table {
				border-collapse: collapse;
				margin: 12px 0;
				width: 100%;
			}
			.md-body th, .md-body td {
				border: 1px solid #ddd;
				padding: 8px 12px;
				text-align: left;
				font-size: 13px;
			}
			.md-body th {
				background: #f5f5f5;
				font-weight: bold;
			}
			.md-body tr:nth-child(even) {
				background: #fafafa;
			}
			.md-body .md-list-item {
				margin: 4px 0;
				line-height: 1.5;
				color: #333;
			}
			.md-body hr {
				border: none;
				border-top: 1px solid #ddd;
				margin: 16px 0;
			}
			.md-body strong {
				font-weight: bold;
			}
			.md-body em {
				font-style: italic;
			}
		</style>

		<script type="text/javascript">
			var FILES = {{files}};

			$(document).ready(function()
			{
				renderSidebar();

				var params = new URLSearchParams(window.location.search);
				var fileParam = params.get("file");
				if (fileParam)
				{
					var item = $(".sidebar-list li[data-filename='" + fileParam + "']");
					if (item.length)
					{
						item.addClass("active");
						loadFile(fileParam);
					}
				}
			});

			function renderSidebar()
			{
				var list = $(".sidebar-list");
				for (var i = 0; i < FILES.length; i++)
				{
					var li = $("<li></li>");
					li.text(FILES[i].display);
					li.attr("data-filename", FILES[i].filename);
					li.click(onFileClick);
					list.append(li);
				}
			}

			function onFileClick()
			{
				$(".sidebar-list li").removeClass("active");
				$(this).addClass("active");

				var filename = $(this).attr("data-filename");
				var url = window.location.pathname + "?file=" + encodeURIComponent(filename);
				history.replaceState(null, "", url);
				loadFile(filename);
			}

			function loadFile(filename)
			{
				$(".main-content").html("<div class='loading'>Loading...</div>");

				$.ajax({
					url: "/doc_library/file?name=" + encodeURIComponent(filename),
					type: "GET",
					dataType: "text",
					success: function(content)
					{
						var html = renderMarkdown(content);
						$(".main-content").html("<div class='md-body'>" + html + "</div>");
					},
					error: function()
					{
						$(".main-content").html("<div class='loading'>Failed to load file.</div>");
					}
				});
			}

			function escapeHtml(text)
			{
				return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
			}

			function inlineFormat(text)
			{
				text = escapeHtml(text);
				text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
				text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
				text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
				return text;
			}

			function renderMarkdown(md)
			{
				var lines = md.split("\n");
				var html = "";
				var inCodeBlock = false;
				var codeContent = "";
				var inTable = false;

				for (var i = 0; i < lines.length; i++)
				{
					var line = lines[i];

					if (line.trim().indexOf("```") === 0)
					{
						if (inCodeBlock)
						{
							html += "<pre><code>" + escapeHtml(codeContent) + "</code></pre>";
							codeContent = "";
							inCodeBlock = false;
						}
						else
						{
							inCodeBlock = true;
						}
						continue;
					}

					if (inCodeBlock)
					{
						codeContent += (codeContent ? "\n" : "") + line;
						continue;
					}

					if (inTable && line.trim().indexOf("|") !== 0)
					{
						html += "</tbody></table>";
						inTable = false;
					}

					if (/^\s*---+\s*$/.test(line))
					{
						html += "<hr>";
						continue;
					}

					if (line.indexOf("#### ") === 0)
					{
						html += "<h4>" + inlineFormat(line.substr(5)) + "</h4>";
						continue;
					}
					if (line.indexOf("### ") === 0)
					{
						html += "<h3>" + inlineFormat(line.substr(4)) + "</h3>";
						continue;
					}
					if (line.indexOf("## ") === 0)
					{
						html += "<h2>" + inlineFormat(line.substr(3)) + "</h2>";
						continue;
					}
					if (line.indexOf("# ") === 0)
					{
						html += "<h1>" + inlineFormat(line.substr(2)) + "</h1>";
						continue;
					}

					if (line.trim().indexOf("|") === 0)
					{
						if (/^\s*\|[\s\-:|]+\|\s*$/.test(line))
						{
							continue;
						}

						var cells = line.split("|");
						cells = cells.filter(function(c, idx) { return idx > 0 && idx < cells.length - 1; });

						if (!inTable)
						{
							html += "<table><thead><tr>";
							for (var j = 0; j < cells.length; j++)
							{
								html += "<th>" + inlineFormat(cells[j].trim()) + "</th>";
							}
							html += "</tr></thead><tbody>";
							inTable = true;
							continue;
						}

						html += "<tr>";
						for (var j = 0; j < cells.length; j++)
						{
							html += "<td>" + inlineFormat(cells[j].trim()) + "</td>";
						}
						html += "</tr>";
						continue;
					}

					var listMatch = line.match(/^(\s*)-\s(.*)/);
					if (listMatch)
					{
						var indent = listMatch[1].length;
						html += "<div class='md-list-item' style='padding-left:" + (indent * 6 + 16) + "px'>&bull; " + inlineFormat(listMatch[2]) + "</div>";
						continue;
					}

					if (line.trim() === "")
					{
						continue;
					}

					html += "<p>" + inlineFormat(line) + "</p>";
				}

				if (inCodeBlock)
				{
					html += "<pre><code>" + escapeHtml(codeContent) + "</code></pre>";
				}
				if (inTable)
				{
					html += "</tbody></table>";
				}

				return html;
			}
		</script>

    </head>
    <body>
		<div class="layout">
			<div class="sidebar">
				<div class="sidebar-header">Doc Library</div>
				<ul class="sidebar-list"></ul>
			</div>
			<div class="main-content">
				<div class="welcome-message">Select a document from the sidebar to view it.</div>
			</div>
		</div>
    </body>
</html>
