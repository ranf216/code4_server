<!DOCTYPE html>
<html>
    <head>
		<title>{{system}} {{environment}} - Log Analyzer</title>
		<link rel="shortcut icon" href="/favicon.ico?src=log_analyzer" />
		<script type="text/javascript" src="/public/jquery-1.8.2.mini.js"></script>
		<script type="text/javascript" src="/public/jquery.cookie.js"></script>
        <script src="{{socket_url}}/socket.io/socket.io.js"></script>
		<link rel="stylesheet" type="text/css" href="/public/tools-common.css" />

		<style type="text/css">
			html, body {height: 100%; width: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif;}
			#outer {height: 100%; width: 100%; margin: 0; padding: 0;}
			
			/* Header/Controls Styling */
			#inner_fixed {background: #f5f5f5; border-bottom: 2px solid #ccc; padding: 0;}
            #header {padding: 10px;}

			/* Content Area - UNCHANGED */
			#content {position: absolute; bottom: 0; width: 100%; overflow: scroll; font: 16px "courier new";}

            td {padding-left: 20px;}
            
            .alalyze_option {
            	display: inline-block;
            	border: 1px solid #ddd;
            	padding: 10px;
            	background: #fafafa;
            	border-radius: 5px;
            	margin-right: 10px;
            	margin-bottom: 10px;
            }
            .alalyze_option_title {
            	padding-bottom: 8px;
            	font-weight: bold;
            	color: #333;
            }
            
            input[type="text"] {
            	padding: 5px;
            	border: 1px solid #ccc;
            	border-radius: 3px;
            }
            input[type="checkbox"] {
            	cursor: pointer;
            	vertical-align: middle;
            }
            
            button {
            	padding: 5px 15px;
            	background: #2196F3;
            	color: white;
            	border: none;
            	border-radius: 3px;
            	cursor: pointer;
            	font-weight: bold;
            }
            button:hover {background: #0b7dda;}
            
            .date {width: 130px;}
            .user_param {width: 260px;}
            .log_table {width: 120px;}
            .row_id {width: 320px;}
            .request {width: 200px;}
            .substring {width: 400px;}
            .lines {width: 80px;}
            .alalyze_option_title span {font-weight: normal; padding-left: 20px;}
            .check {
            	padding-right: 5px;
            	cursor: pointer;
            	user-select: none;
            }
            .check:hover {text-decoration: underline;}
            
            .rc_error {color: red;}
            .current_values {background-color: #ffefd5;}
            .Insert_values {background-color: lightblue;}
            .Delete_values {background-color: #ffb6c1;}
            .Update_values0 {background-color: #ffffff;}
            .Update_values1 {background-color: #eeeeee;}
            .values_title {font-weight: bold;}
            .update_row_sep {border-bottom: #444444 1px solid;}
            .update_val_sep {border-bottom: #aaaaaa 1px solid;}
			.filter_data:hover {text-decoration: underline;}
			#query_content tr:hover {background: #f0f0f0; font-weight: bold;}

            .spacer1 {width: 1px; display: inline-block;}
            .spacer20 {width: 20px; display: inline-block;}
            .spacer25 {width: 25px; display: inline-block;}
            .spacer50 {width: 50px; display: inline-block;}
			.spacer90 {width: 90px; display: inline-block;}
			.inline_spacer {width: 100px; display: inline-block;}
			.vspacer {height: 8px;}
            .large_vspacer {height: 20px;}
            
            hr {border: none; border-top: 1px solid #ccc; margin: 8px 0 0 0;}
            
            /* Modal Styles */
			#logModal {
				display: none;
				position: fixed;
				z-index: 10000;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.6);
				align-items: center;
				justify-content: center;
			}
			#logModal.show {
				display: flex;
			}
			.modal-content {
				background-color: #fff;
				border-radius: 8px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
				max-width: 90%;
				max-height: 90%;
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			.modal-header {
				padding: 16px 20px;
				background: #f5f5f5;
				border-bottom: 1px solid #ddd;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			.modal-header h3 {
				margin: 0;
				font-size: 18px;
				color: #333;
			}
			.modal-close {
				background: #f44336;
				color: white;
				border: none;
				padding: 6px 12px;
				border-radius: 3px;
				cursor: pointer;
				font-size: 14px;
				font-weight: bold;
			}
			.modal-close:hover {
				background: #da190b;
			}
			.modal-body {
				padding: 20px;
				overflow: auto;
				flex: 1;
				min-height: 0;
			}
			.modal-body pre {
				margin: 0;
				white-space: pre-wrap;
				word-wrap: break-word;
				font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
				font-size: 14px;
				line-height: 1.5;
			}
			
			/* JSON Syntax Highlighting */
			.modal-body .string { color: #0d904f; }
			.modal-body .number { color: #1976d2; }
			.modal-body .boolean { color: #d32f2f; }
			.modal-body .null { color: #9e9e9e; }
			.modal-body .key { color: #6f42c1; font-weight: bold; }

			.type_REQUEST {color: #800000;}
			.type_RESPONSE {color: #004000;}
			.type_FAILED_RESPONSE {color: #ff0000;}
			.type_ERROR {color: #ff0000;}
			.type_WARNING {color: #ff8000;}
			.type_INFO {color: #0000ff;}
			.type_DEBUG {color: #00a000;}
			.type_{{project}} {color: #7137f7;}
			.simple_data {cursor: default;}
			.filter_data {cursor: pointer;}
			.filter_data:hover {text-decoration: underline;}
			#content td {outline: none; border: none; box-shadow: none;}
			#content td:focus, #content td:active, #content td:focus-visible {outline: none; border: none; box-shadow: none;}
		</style>

        <script type="text/javascript">
            let filterIp = "";
            let filterReq = "";
            let filterReqId = "";
            let filterType = "";

			$(document).ready(function()
			{
				const element = document.getElementById("inner_fixed");
				const observer = new ResizeObserver(entries =>
				{
					for (let entry of entries)
					{
						console.log('Height changed to', entry.contentRect.height);
						$("#content").css("top", entry.contentRect.height);
						// Your callback here
					}
				}).observe(element);
				
				// Close modal on Escape key
				$(document).on('keydown', function(e) {
					if (e.key === 'Escape' || e.keyCode === 27) {
						closeLogModal();
					}
				});
			});

            function clearAllMessage()
            {
                $("#content").html("");
            }

            function appendLine(line)
            {
                $("#content").append(line);
                $('#content').scrollTop($('#content')[0].scrollHeight);
            }

            function analyzeOverload()
            {
                clearAllMessage();

                makeApiCall({"#request": "System/analyze_logs", "token": jQuery.cookie("system_token"), "date": $("#date").val()}, rc =>
                {
                    let content = `<table cellpadding="5" cellspacing="0" border="0">`;

                    if (rc.rc == 0)
                    {
                        if (rc.calls.length == 0)
                        {
                            content += `<tr><td>No results</td></tr>`;
                        }

                        rc.calls.forEach(call =>
                        {
                            content += `<tr><td>${call.datetime}</td><td>${call.ip_address}</td><td>${call.request_name}</td><td>${call.num_of_calls}</td></tr>`;
                        });
                    }
                    else
                    {
                        content += `<tr><td class="rc_error">[${rc.rc}] ${rc.message}</td></tr>`;
                    }

                    content += `</table>`;

                    appendLine(content);
                });
            }

            function query()
            {
                const substring = $("#substring").val();
                const lines = $("#lines").val();
                const date_from = $("#date_from").val();
                const date_to = $("#date_to").val();
                const request = $("#request").val();
                const chk_Rq = $("#chk_Rq").prop("checked");
                const chk_Rs = $("#chk_Rs").prop("checked");
                const chk_Otr = $("#chk_Otr").prop("checked");
                const chk_ERR = $("#chk_ERR").prop("checked");
                const chk_RCE = $("#chk_RCE").prop("checked");

                clearAllMessage();

                makeApiCall({"#request": "System/query_logs", "token": jQuery.cookie("system_token"),
                            "substring": substring, "lines": lines, "date_from": date_from, "date_to": date_to, "request": request,
                            "set_request": chk_Rq, "set_response": chk_Rs, "set_other": chk_Otr, "is_error": chk_ERR, "is_rc_error": chk_RCE}, rc =>
                {
                    let content = `<table cellpadding="5" cellspacing="0" border="0" id="query_content">`;

                    if (rc.rc == 0)
                    {
                        if (rc.lines.length == 0)
                        {
                            content += ("<tr><td>No results</td></tr>");
                        }

                        rc.lines.forEach(call =>
                        {
                            let isErr = (call.type == "RESPONSE" && call.text.indexOf("\"rc\":0") === -1);

                            let requestName = call.request_name.split("/").join("_");
                            let ipStr = call.ip_address.replace(/[\.,:]/g, "_");
                            let classes = `ip_${ipStr} type_${call.type} req_${requestName} reqid_${call.uid}`;

                            content += `<tr class="type_${call.type} ${classes}">
                                            <td class="simple_data">${call.datetime}</td>
                                            <td class="filter_data" onclick='doOnClick(1, "${call.ip_address}")'>${call.ip_address}</td>
                                            <td class="filter_data" onclick='doOnClick(2, "${call.type}")'>${call.type}</td>
                                            <td class="filter_data" onclick='doOnClick(3, "${call.request_name}")'>${call.request_name}</td>
                                            <td class="filter_data" onclick='doOnClick(4, "${call.uid}")'>${call.uid}</td>
                                            <td class="simple_data ${isErr ? "type_FAILED_RESPONSE" : ""}" onclick="copyToClipboard($(this).html().trim(), event)">${call.text}</td>
                                        </tr>`;
                        });
                    }
                    else
                    {
                        content += `<tr><td class="rc_error">[${rc.rc}] ${rc.message}</td></tr>`;
                    }

                    content += `</table>`;

                    appendLine(content);
                    $('#content').scrollTop(0);
                });
            }

            function reset_query()
            {
                $("#chk_Rq").attr('checked', true);
                $("#chk_Rs").attr('checked', true);
                $("#chk_Otr").attr('checked', true);
                $("#chk_ERR").attr('checked', false);
                $("#chk_RCE").attr('checked', false);

                $("#substring").val("");
                $("#lines").val("100");
                $("#date_from").val("");
                $("#date_to").val("");
                $("#request").val("");

                query();
            }

            function getUser()
            {
                clearAllMessage();

                makeApiCall({"#request": "System/get_user_by_param", "token": jQuery.cookie("system_token"), "user_param": $("#user_param").val()}, rc =>
                {
                    let content = `<table cellpadding="5" cellspacing="0" border="0">`;

                    if (rc.rc == 0)
                    {
                        let allUserTypes = "";
                        let allUserRoles = "";

                        Object.entries(rc.all_user_types).forEach(jsonObj =>
                        {
                            const id = jsonObj[0];
                            const name = jsonObj[1];
                            allUserTypes += `${id} - ${name}<br/>`;
                        });

                        if (rc.all_user_roles)
                        {
                            Object.entries(rc.all_user_roles).forEach(jsonObj =>
                            {
                                const id = jsonObj[0];
                                const name = jsonObj[1];
                                allUserRoles += `${id} - ${name}<br/>`;
                            });
                        }
                        else
                        {
                            allUserRoles = "None";
                        }

                        const userRoles = rc.user_info.roles.join(",") || "-";

                        content += `<tr><td>User Types</td><td>User Roles</td></tr>`;
                        content += `<tr><td valign="top">${allUserTypes}</td><td valign="top">${allUserRoles}</td><td></td><td</td><td></td></tr>`;
                        content += `<tr><td>&nbsp;</td><td>&nbsp;</td></tr>`;

                        content += `<tr><td>User Id</td><td>${rc.user_info.user_id}</td></tr>`;
                        content += `<tr><td>Token</td><td>${rc.user_info.user_token}</td></tr>`;
                        content += `<tr><td>Status</td><td>${rc.user_info.status}</td></tr>`;
                        content += `<tr><td>User Type</td><td>${rc.user_info.user_type} - ${rc.all_user_types[rc.user_info.user_type]}</td></tr>`;
                        content += `<tr><td>Roles</td><td>${userRoles}</td></tr>`;
                        content += `<tr><td>email</td><td>${rc.user_info.email}</td></tr>`;
                        content += `<tr><td>phone</td><td>${rc.user_info.phone}</td></tr>`;
                    }
                    else
                    {
                        content += `<tr><td class="rc_error">[${rc.rc}] ${rc.message}</td></tr>`;
                    }

                    content += `</table>`;

                    appendLine(content);
                });
            }

			function doOnClick(cell, str)
			{
                if (window.getSelection().toString().length > 0)
                {
                    return;
                }

				switch (cell)
				{
					case 1:
						filterIp = (filterIp ? "" : str);
					break;
					case 2:
                        filterType = (filterType ? "" : str);
					break;
					case 3:
						filterReq = (filterReq ? "" : str);
					break;
					case 4:
						filterReqId = (filterReqId ? "" : str);
					break;
				}
				
				filter();
			}

			function filter()
			{
				$("#query_content tr").show();

				if (filterIp != "")
				{
                    let ipStr = filterIp.replace(/[\.,:]/g, "_");
					$("#content tr:not(.ip_" + ipStr + ")").hide();
				}

				if (filterType != "")
				{
					$("#content tr:not(.type_" + filterType + ")").hide();
				}

				if (filterReq != "")
				{
                    let requestName = filterReq.split("/").join("_");
					$("#content tr:not(.req_" + requestName + ")").hide();
				}

				if (filterReqId != "")
				{
					$("#content tr:not(.reqid_" + filterReqId + ")").hide();
				}
			}

			function copyToClipboard(text, event)
			{
                // Check for Ctrl+Click to show modal (do this first, before selection check)
                if (event && event.ctrlKey)
                {
                    event.preventDefault();
                    event.stopPropagation();
                    window.getSelection().removeAllRanges();
                    showLogModal(text);
                    return;
                }
                
                if (window.getSelection().toString().length > 0)
                {
                    return;
                }

				if (navigator.clipboard)
				{
					navigator.clipboard.writeText(text)
					.then(() =>
					{
						showToast("Copied to clipboard!");
					})
					.catch(err =>
					{
						showToast("Failed to copy text", true);
					});
				}
				else
				{
					const textarea = document.createElement("textarea");
					textarea.value = text;
					document.body.appendChild(textarea);
					textarea.select();
					document.execCommand("copy");
					document.body.removeChild(textarea);
					showToast("Copied to clipboard!");
				}
			}
			
			function syntaxHighlight(json)
			{
				if (typeof json == 'undefined' || json == null)
				{
					return "";
				}
				
				if (typeof json != 'string')
				{
					json = JSON.stringify(json, undefined, 4);
				}
				
				json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
				return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
					var cls = 'number';
					if (/^"/.test(match)) {
						if (/:$/.test(match)) {
							cls = 'key';
						} else {
							cls = 'string';
						}
					} else if (/true|false/.test(match)) {
						cls = 'boolean';
					} else if (/null/.test(match)) {
						cls = 'null';
					}
					return '<span class="' + cls + '">' + match + '</span>';
				});
			}
			
			function showLogModal(text)
			{
				const modal = document.getElementById('logModal');
				const modalBody = document.getElementById('logModalBody');
				
				// Try to parse as JSON
				let content = text;
				try {
					const parsed = JSON.parse(text);
					content = syntaxHighlight(parsed);
				} catch (e) {
					// Not valid JSON, display as plain text with HTML escaping
					content = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
				}
				
				modalBody.innerHTML = '<pre>' + content + '</pre>';
				modal.classList.add('show');
			}
			
			function closeLogModal()
			{
				const modal = document.getElementById('logModal');
				modal.classList.remove('show');
			}

			function showToast(message, isErr = false)
			{
				const toast = document.createElement("div");
				toast.textContent = message;
				toast.style.position = "fixed";
				toast.style.bottom = "40px";
				toast.style.left = "50%";
				toast.style.transform = "translateX(-50%)";
				toast.style.background = (isErr ? "#A00000" : "#333333");
				toast.style.color = "#ffffff";
				toast.style.padding = "10px 20px";
				toast.style.borderRadius = "8px";
				toast.style.boxShadow = "0 2px 10px rgba(0,0,0,0.2)";
				toast.style.zIndex = "9999";
				toast.style.opacity = "0";
				toast.style.transition = "opacity 0.3s";

				document.body.appendChild(toast);

				// Fade in
				requestAnimationFrame(() =>
				{
					toast.style.opacity = "1";
				});

				// Remove after 1 second
				setTimeout(() =>
				{
					toast.style.opacity = "0";
					toast.addEventListener("transitionend", () =>
					{
						toast.remove();
					});
				}, 1000);
			}
        </script>
		<script type="text/javascript">var API_URL = "{{api_url}}"; var TOOL_NAME = "{{tool_name}}";</script>
		<script type="text/javascript" src="/public/tools-common.js"></script>
    </head>
    <body>
        <div id="outer">
            <div id="inner_fixed">
                <div id="header">
                    <div>{{getWebClientMessages}}{{getWebClientEnvironment}}</div>
                    <div><input type="button" id="logout" style="{{enable_system_login}}" onclick="doOnLogout()" value="Logout" /></div>
                    <div class="large_vspacer"></div>
                    <div id="alalyze_options">
                        <div id="overload_control" class="alalyze_option">
                            <div class="alalyze_option_title">
                                Overload
                                <span class="spacer25"></span>
                                <button id="analyze_overload" onclick="analyzeOverload()">Analyze</button>
                            </div>
                            Date: <input type="text" id="date" class="date" />
                        </div>
                        <div id="log_control" class="alalyze_option">
                            <div class="alalyze_option_title">
                                Log
                                <span>Substring: <input type="text" id="substring" class="substring" /></span>
                                <span class="alalyze_option_title_end">Lines: <input type="text" id="lines" class="lines" value="100" /></span>
                                <div class="spacer25"></div>
                                <button id="reset_query" onclick="reset_query()">Reset</button>
                                <div class="spacer25"></div>
                                <button id="query" onclick="query()">Query</button>
                            </div>
                            From: <input type="text" id="date_from" class="date" />
                            To: <input type="text" id="date_to" class="date" />
                            Request: <input type="text" id="request" class="reuqest" />
                            <input type="checkbox" id="chk_Rq" checked /><span style="cursor: default;" onclick="$('#chk_Rq').click()" class="check">Rq</span>
                            <input type="checkbox" id="chk_Rs" checked /><span style="cursor: default;" onclick="$('#chk_Rs').click()" class="check">Rs</span>
                            <input type="checkbox" id="chk_Otr" checked /><span style="cursor: default;" onclick="$('#chk_Otr').click()" class="check">Otr</span>
                            <input type="checkbox" id="chk_ERR" /><span style="cursor: default; color: red;" onclick="$('#chk_ERR').click()" class="check">ERR</span>
                            <input type="checkbox" id="chk_RCE"/><span style="cursor: default; color: red;" onclick="$('#chk_RCE').click()" class="check">RCE</span>
                        </div>
                        <div id="user_token_control" class="alalyze_option">
                            <div class="alalyze_option_title">
                                User By Id / Token / Email / Phone
                                <span class="spacer20"></span>
                                <button id="get_user" onclick="getUser()">get</button>
                            </div>
                            Param: <input type="text" id="user_param" class="user_param" />
                        </div>
                    </div>
                    <hr />
                </div>
            </div>
        
            <div id="content">
            </div>
        </div>
        
        <!-- Log Message Modal -->
        <div id="logModal" onclick="if(event.target === this) closeLogModal();">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Log Message</h3>
                    <button class="modal-close" onclick="closeLogModal()">Close</button>
                </div>
                <div class="modal-body" id="logModalBody">
                </div>
            </div>
        </div>
    </body>
</html>
